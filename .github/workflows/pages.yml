name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      HF_OAUTH_CLIENT_ID: ${{ vars.HF_OAUTH_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require registered OAuth client
        run: test -n "$HF_OAUTH_CLIENT_ID"
      - run: npm test
      - run: npm run build
      - name: Verify registered OAuth client
        run: |
          ! test -f dist/oauth-cimd.json
          grep -Fq "$HF_OAUTH_CLIENT_ID" dist/assets/harvard.js
          grep -Fq "$HF_OAUTH_CLIENT_ID" dist/assets/oauth-callback.js
          ! grep -Fq 'oauth-cimd' dist/assets/harvard.js
          ! grep -Fq 'oauth-cimd' dist/assets/oauth-callback.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4