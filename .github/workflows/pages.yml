name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run build
      - name: Verify OAuth client metadata
        run: |
          test -f dist/oauth-cimd.json
          node -e "const fs=require('node:fs'); const p='dist/oauth-cimd.json'; const m=JSON.parse(fs.readFileSync(p,'utf8')); if (!m.client_id?.endsWith('/oauth-cimd.json') || !m.redirect_uris?.length || m.token_endpoint_auth_method !== 'none') process.exit(1)"
          grep -Fq '/open-shelves/oauth-cimd.json' dist/assets/harvard.js
          grep -Fq '/open-shelves/oauth-cimd.json' dist/assets/oauth-callback.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
