name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      HF_OAUTH_CLIENT_ID: ${{ vars.HF_OAUTH_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install visual-test browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run source and unit tests
        run: npm test

      - name: Capture and verify mobile reader screenshots
        run: npm run test:visual

      - name: Upload mobile reader screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-mobile-${{ github.sha }}
          path: test-results/visual/**/*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Build production site
        run: npm run build

      - name: Verify access configuration
        run: |
          ! test -f dist/oauth-cimd.json
          test -f dist/assets/auth-fallback.js
          grep -Fq 'hf-token-form' dist/index.html
          grep -Fq 'hf-oauth-client-id' dist/index.html
          ! grep -Fq 'oauth-cimd' dist/assets/harvard.js
          ! grep -Fq 'oauth-cimd' dist/assets/oauth-callback.js
          if [ -n "$HF_OAUTH_CLIENT_ID" ]; then
            grep -Fq "$HF_OAUTH_CLIENT_ID" dist/assets/harvard.js
            grep -Fq "$HF_OAUTH_CLIENT_ID" dist/assets/oauth-callback.js
          else
            grep -Fq 'missing-hf-oauth-client-id' dist/assets/harvard.js
            grep -Fq 'missing-hf-oauth-client-id' dist/assets/oauth-callback.js
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
