name: Preview library and search

on:
  push:
    branches: [feature/library-search]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-previews:
    runs-on: ubuntu-latest
    env:
      HF_OAUTH_CLIENT_ID: ${{ secrets.HF_OAUTH_CLIENT_ID }}
    steps:
      - name: Check out library/search branch
        uses: actions/checkout@v4
        with:
          path: library

      - name: Check out durable-reader branch
        uses: actions/checkout@v4
        with:
          ref: feature/durable-reader
          path: durable

      - name: Check out production branch
        uses: actions/checkout@v4
        with:
          ref: main
          path: production

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Require registered OAuth client
        run: test -n "$HF_OAUTH_CLIENT_ID"

      - name: Install visual-test dependencies
        working-directory: library
        run: npm install --no-audit --no-fund

      - name: Install visual-test browsers
        working-directory: library
        run: npx playwright install --with-deps chromium webkit

      - name: Capture and verify stacked mobile reader screenshots
        working-directory: library
        run: npm run test:visual

      - name: Upload stacked mobile reader screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: library-search-mobile-${{ github.sha }}
          path: library/test-results/visual/**/*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Test and build durable-reader preview
        working-directory: durable
        env:
          OPEN_SHELVES_PREVIEW_SLUG: durable-reader
        run: |
          npm test
          npm run build
          node scripts/build-preview.mjs

      - name: Test and build library/search preview
        working-directory: library
        env:
          OPEN_SHELVES_PREVIEW_SLUG: library-search
        run: |
          npm test
          npm run build
          node scripts/build-preview.mjs

      - name: Rebuild production root from main
        working-directory: production
        run: |
          npm test
          npm run build

      - name: Mount both previews beneath production
        run: |
          mkdir -p production/dist/previews/durable-reader production/dist/previews/library-search
          cp -a durable/dist/. production/dist/previews/durable-reader/
          cp -a library/dist/. production/dist/previews/library-search/
          test -f production/dist/index.html
          test -f production/dist/previews/durable-reader/index.html
          test -f production/dist/previews/library-search/index.html
          ! test -f production/dist/previews/durable-reader/oauth-cimd.json
          ! test -f production/dist/previews/library-search/oauth-cimd.json
          test -f production/dist/previews/durable-reader/preview-build.json
          test -f production/dist/previews/library-search/preview-build.json
          grep -Fq '/open-shelves/previews/durable-reader/assets/harvard.js?v=' production/dist/previews/durable-reader/index.html
          grep -Fq '/open-shelves/previews/library-search/assets/app.js?v=' production/dist/previews/library-search/index.html
          grep -Fq "$HF_OAUTH_CLIENT_ID" production/dist/previews/durable-reader/assets/harvard.js
          grep -Fq "$HF_OAUTH_CLIENT_ID" production/dist/previews/library-search/assets/harvard.js
          ! grep -Fq 'oauth-cimd' production/dist/previews/durable-reader/assets/harvard.js
          ! grep -Fq 'oauth-cimd' production/dist/previews/library-search/assets/harvard.js
          DURABLE_SHA=$(git -C durable rev-parse HEAD)
          LIBRARY_SHA=$(git -C library rev-parse HEAD)
          DURABLE_SHA="$DURABLE_SHA" LIBRARY_SHA="$LIBRARY_SHA" node -e "const fs=require('node:fs'); const d=JSON.parse(fs.readFileSync('production/dist/previews/durable-reader/preview-build.json')); const l=JSON.parse(fs.readFileSync('production/dist/previews/library-search/preview-build.json')); if (d.sha !== process.env.DURABLE_SHA || l.sha !== process.env.LIBRARY_SHA) { console.error({d,l}); process.exit(1); }"

      - name: Route nested app URLs
        run: |
          cat > production/dist/404.html <<'EOF'
          <!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Opening Open Shelves…</title></head><body><p>Opening Open Shelves…</p><script>
          const route = `${location.pathname}${location.search}${location.hash}`;
          const previews = ['durable-reader', 'library-search'];
          const slug = previews.find(value => location.pathname.startsWith(`/open-shelves/previews/${value}/`));
          const base = slug ? `/open-shelves/previews/${slug}` : '/open-shelves';
          location.replace(`${base}/?route=${encodeURIComponent(route)}`);
          </script><noscript><a href="/open-shelves/">Return to Open Shelves</a></noscript></body></html>
          EOF

      - uses: actions/configure-pages@v5

      - name: Upload combined Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: production/dist

  deploy-previews:
    needs: build-previews
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy stacked previews
        id: deployment
        uses: actions/deploy-pages@v4
